[workspace]
resolver = "2"
members = ["crates/crucible"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/crucible-models"

[workspace.dependencies]
# Converge platform contracts
converge-pack = "3.9.0"
converge-optimization = "3.9.0"

# ML training frameworks
# Burn: deep-learning / differentiable models (ANFIS).
burn = { version = "0.20.0", features = ["ndarray", "train"] }
# Linfa: classical / non-differentiable models (Random Forest, CART, SVMs).
# See kb/Architecture/Backend Library Choices.md for the per-pack rationale.
linfa = "0.8"
linfa-trees = { version = "0.8", features = ["serde"] }
ndarray = "0.17.2"
# linfa pins ndarray 0.16; renamed to avoid clashing with workspace's 0.17.
# Used only at the linfa interop boundary in crates that touch linfa types.
ndarray-linfa = { package = "ndarray", version = "0.16" }

# Data
polars = { version = "0.51.0", features = ["csv", "lazy", "log", "ndarray", "parquet", "rows"] }
calamine = "0.34"

# Object storage (optional)
converge-storage = { version = "3.9.0", default-features = false }

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1.5"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
bincode = "1.3"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
tracing = "0.1"

# Dev
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"
default_trait_access = "allow"
struct_field_names = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
# ML metric assertions compare exact-fixture floats; acceptable in this crate.
float_cmp = "allow"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

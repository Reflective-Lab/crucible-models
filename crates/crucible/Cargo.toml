[package]
name = "converge-crucible-models"
description = "Trained-model packs for the Converge Engine — Decision Trees, Random Forests, SVMs (linfa) and ANFIS (Burn)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "crucible"
path = "src/lib.rs"

[dependencies]
converge-pack.workspace = true
converge-optimization.workspace = true
burn.workspace = true
linfa.workspace = true
linfa-trees.workspace = true
ndarray.workspace = true
ndarray-linfa.workspace = true
polars.workspace = true
calamine = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
proptest.workspace = true
rand.workspace = true
reqwest.workspace = true
bincode.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
excel = ["dep:calamine"]

[dev-dependencies]
tempfile.workspace = true
# Tests that drive an `async` Suggestor::execute over polars I/O need a
# block_on that *does not* register a tokio runtime — polars' interior
# parquet reader unconditionally tries to spin up its own tokio runtime
# and panics if one is already on the stack. `futures::executor::block_on`
# provides a runtime-free driver that satisfies that constraint.
futures = "0.3"

[lints]
workspace = true

name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  # Coverage floor (Extension Release Checklist §4)
  COVERAGE_FLOOR: "70"

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # Excludes test, bench, example dirs, binary-entry-point modules
        # (CLIs in `bin/` and any `main.rs`/`suggestor.rs`), and the
        # `fixtures` module which is itself test infrastructure. Binaries
        # are exercised by integration-harness end-to-end runs, not by
        # this crate's unit tests — including them depresses coverage
        # without measuring anything that unit tests should reach.
        #
        # Note: `training.rs` is currently around 59% line / 38% function
        # coverage. The pipeline agents (DatasetAgent, FeatureEngineeringAgent,
        # ModelTrainingAgent, etc.) need dedicated intent-encoded tests —
        # tracked separately, not addressed by tightening this regex.
        run: |
          cargo llvm-cov --workspace --lib --tests \
            --ignore-filename-regex '(^|/)(tests|benches|examples)/|(^|/)bin/|(^|/)(main|suggestor)\.rs$|(^|/)fixtures\.rs$' \
            --json --summary-only --output-path coverage.json
      - name: Extract coverage percentage
        id: cov
        run: |
          if [ -f coverage.json ]; then
            COV=$(python3 -c "import json; d=json.load(open('coverage.json')); print(f\"{d['data'][0]['totals']['lines']['percent']:.1f}\")")
            echo "percent=$COV" >> "$GITHUB_OUTPUT"
            echo "### Coverage: ${COV}%" >> "$GITHUB_STEP_SUMMARY"
            python3 -c "exit(0 if float('$COV') >= float('$COVERAGE_FLOOR') else 1)" || \
              { echo "FAIL: coverage $COV% below ${COVERAGE_FLOOR}% floor" >&2 ; exit 1; }
          else
            echo "FAIL: coverage.json not produced" >&2
            exit 1
          fi

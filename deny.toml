# cargo-deny configuration (0.19.x)
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check  (or: just security-audit)

[advisories]
unmaintained = "workspace"
yanked = "warn"
# Keep in sync with the `--ignore` flags passed to `cargo audit` in the
# Justfile `security-audit` recipe. Cargo-audit and cargo-deny use separate
# ignore mechanisms.
ignore = [
    # bincode 1.x and 2.x are unmaintained. Directly used for local model
    # artifact serialization and transitive through burn/polars. No upstream
    # replacement is available without changing the model-artifact format.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 is an unmaintained proc macro reached through burn/cubecl.
    # It is compile-time only and not a runtime prediction path.
    "RUSTSEC-2024-0436",
    # lru 0.12.5 has an unsound IterMut API and is reached through
    # ratatui/burn-train. Crucible does not call that API directly.
    "RUSTSEC-2026-0002",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
